name: generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: avani-srivastavaa
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bd34fe
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=#8b5cf6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
