name: generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: avani-srivastavaa
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#bd34fe&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_empty=#161b22
            dist/github-contribution-grid-snake-light.svg?color_snake=#8b5cf6&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39&color_empty=#ebedf0
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
