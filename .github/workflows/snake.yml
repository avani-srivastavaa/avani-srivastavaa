name: generate snake animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
 
permissions:
  contents: write
 
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: avani-srivastavaa
          outputs: dist/github-contribution-grid-snake-dark.svg?color_snake=%23bd34fe,%237c3aed&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353&color_empty=%23161b22
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
